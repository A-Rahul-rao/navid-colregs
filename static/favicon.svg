<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <!-- Neon Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Radar Circular Frame -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="2.5"/>
  
  <!-- Outer Azimuth Graduation Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(0, 210, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3,5"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1"/>

  <!-- Radar Crosshairs -->
  <line x1="64" y1="10" x2="64" y2="118" stroke="rgba(0, 210, 255, 0.25)" stroke-width="1.2"/>
  <line x1="10" y1="64" x2="118" y2="64" stroke="rgba(0, 210, 255, 0.25)" stroke-width="1.2"/>

  <!-- Radar Sweep Phosphor Beam -->
  <path d="M 64 64 L 108 20 A 60 60 0 0 0 74 6 Z" fill="rgba(0, 255, 136, 0.22)"/>
  <line x1="64" y1="64" x2="108" y2="20" stroke="#00ff88" stroke-width="2" filter="url(#cyanGlow)"/>

  <!-- Autonomous Navigation Vessel Chevron (Center) -->
  <polygon points="64,28 78,74 72,82 64,77 56,82 50,74" fill="#00d2ff" stroke="#ffffff" stroke-width="2" filter="url(#cyanGlow)"/>

  <!-- Sidelight Optical Indicators: Red (Port) & Green (Starboard) -->
  <circle cx="50" cy="74" r="3.5" fill="#f43f5e" stroke="#ffffff" stroke-width="1"/>
  <circle cx="78" cy="74" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1"/>

  <!-- Center Heading Vector Marker -->
  <line x1="64" y1="28" x2="64" y2="14" stroke="#00d2ff" stroke-width="2" stroke-linecap="round"/>
</svg>
